name: Check database-backed app
on:
  push:
    branches: [rebuild/vercel-postgres]
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'migrations/**', 'package*.json', 'next.config.ts', 'tsconfig.json']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
